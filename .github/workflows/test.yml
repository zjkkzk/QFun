name: 🏗️ 手动构建 Release APK

on:
  workflow_dispatch:

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🏗️ 构建 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 🌏 设置时区
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: ☕ 设置 JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔐 赋予 gradlew 执行权限
        run: chmod +x gradlew

      # 修复 CMake 报错：Ninja 1.10.2 不支持 C++20 modules，需要 >= 1.11
      - name: 🥷 升级 Ninja (>= 1.11)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build
          SYS_NINJA="$(command -v ninja)"
          SYS_VER="$(ninja --version)"
          if [ "$(printf '%s\n%s\n' "1.11" "$SYS_VER" | sort -V | head -n1)" != "1.11" ]; then
            curl -fsSL -o /tmp/ninja.zip \
              https://github.com/ninja-build/ninja/releases/latest/download/ninja-linux.zip
            sudo apt-get install -y unzip
            sudo unzip -o /tmp/ninja.zip -d /usr/local/bin
            sudo chmod +x /usr/local/bin/ninja
            SYS_NINJA="/usr/local/bin/ninja"
          fi
          echo "Using ninja: $SYS_NINJA ($($SYS_NINJA --version))"
          for f in /usr/local/lib/android/sdk/cmake/*/bin/ninja; do
            [ -e "$f" ] || continue
            echo "Replacing $f"
            sudo cp -L "$SYS_NINJA" "$f"
            sudo chmod +x "$f"
            echo "  -> $("$f" --version)"
          done

      # 生成 CI 临时 Release Keystore，用于给 release 包签名
      - name: 🔑 生成临时 Release Keystore
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          rm -f "$KEYSTORE_FILE"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE" \
            -alias qfun \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass qfun123456 -keypass qfun123456 \
            -dname "CN=QFun, OU=Dev, O=QFun, L=Shanghai, ST=Shanghai, C=CN"
          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: 🐘 配置 Gradle
        uses: gradle/actions/setup-gradle@v5

      # 用 AGP injected signing 注入签名，无需修改 build.gradle.kts
      - name: 🛠️ 构建 Release APK
        run: |
          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password=qfun123456 \
            -Pandroid.injected.signing.key.alias=qfun \
            -Pandroid.injected.signing.key.password=qfun123456

      - name: 📤 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: QFun-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3
